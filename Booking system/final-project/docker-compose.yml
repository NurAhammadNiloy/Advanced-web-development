name: Advanced-Web-Development-Final-Project
services:
  frontend:
    build:
      context: ./frontend
    container_name: fullstack-frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: ./backend
    container_name: fullstack-api
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppassword}
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: fullstack-db
    environment:
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppassword}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - pgroot:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"

volumes:
  pgroot: {}
